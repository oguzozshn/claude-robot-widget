<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Claude Robot</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  #bot { width: 100%; height: 100%; display: block; overflow: visible; }

  /* Boş köşelerde tıklama arkadaki pencereye geçsin diye sadece robotun
     gövde parçaları fare olaylarını yakalar. */
  #bot { pointer-events: none; }
  #bot rect, #bot circle, #bot ellipse, #bot path { pointer-events: auto; }
  #shadow, #thrust { pointer-events: none; }

  /* --- robot renk temaları --- */
  .theme-neon {
    --m0:#39414f; --m1:#2e3440; --m2:#232833; --m3:#1b1f27; --edge:#0d1016;
    --visor1:#0d1117; --visor2:#161c26; --screen-bg:#080c11; --screen-edge:#2b3442;
    --led:#22d3ee; --shadow-c:rgba(0,0,0,.30);
  }
  .theme-silver {
    --m0:#f1f4f7; --m1:#dce1e6; --m2:#b8c0c8; --m3:#98a1aa; --edge:#7d868f;
    --visor1:#141a21; --visor2:#222b35; --screen-bg:#101821; --screen-edge:#8e979f;
    --led:#3b82f6; --shadow-c:rgba(0,0,0,.22);
  }
  .theme-blue {
    --m0:#5b8ff0; --m1:#3b6fd4; --m2:#2b53a3; --m3:#22417e; --edge:#16305e;
    --visor1:#0a1526; --visor2:#12233d; --screen-bg:#08111f; --screen-edge:#2f5896;
    --led:#7dd3fc; --shadow-c:rgba(0,0,0,.28);
  }
  .theme-red {
    --m0:#f07a6c; --m1:#e0564a; --m2:#a83a33; --m3:#7f2320; --edge:#571716;
    --visor1:#1c0f0e; --visor2:#2b1615; --screen-bg:#170c0b; --screen-edge:#8a3b34;
    --led:#ffb4a2; --shadow-c:rgba(0,0,0,.28);
  }
  .theme-pastel {
    --m0:#fdeef8; --m1:#f6d6ec; --m2:#dcbaea; --m3:#c9a7e8; --edge:#a888cc;
    --visor1:#3b2b52; --visor2:#4d3a66; --screen-bg:#fff6fb; --screen-edge:#c9a7e8;
    --led:#ff8fc7; --shadow-c:rgba(120,80,150,.22);
  }
</style>
</head>
<body class="theme-neon">

<svg id="bot" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gHead" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="var(--m0)"/>
      <stop offset="0.5" stop-color="var(--m1)"/>
      <stop offset="1" stop-color="var(--m2)"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="var(--m1)"/>
      <stop offset="0.6" stop-color="var(--m2)"/>
      <stop offset="1" stop-color="var(--m3)"/>
    </linearGradient>
    <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--m1)"/>
      <stop offset="1" stop-color="var(--m3)"/>
    </linearGradient>
    <linearGradient id="gVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--visor1)"/>
      <stop offset="1" stop-color="var(--visor2)"/>
    </linearGradient>
    <radialGradient id="gThrust" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--led)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="var(--led)" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipScreen"><rect x="66" y="142" width="68" height="30" rx="8"/></clipPath>
    <clipPath id="clipHead"><rect x="50" y="40" width="100" height="78" rx="39"/></clipPath>
  </defs>

  <ellipse id="shadow" cx="100" cy="240" rx="34" ry="6" fill="var(--shadow-c)"/>

  <g id="float">
    <g id="armL">
      <rect x="31" y="130" width="19" height="46" rx="9.5" fill="url(#gArm)" stroke="var(--edge)" stroke-width="1"/>
      <rect x="35" y="136" width="4" height="20" rx="2" fill="var(--m0)" opacity="0.35"/>
    </g>
    <g id="armR">
      <rect x="150" y="130" width="19" height="46" rx="9.5" fill="url(#gArm)" stroke="var(--edge)" stroke-width="1"/>
      <rect x="161" y="136" width="4" height="20" rx="2" fill="var(--m0)" opacity="0.35"/>
    </g>

    <ellipse id="thrust" cx="100" cy="212" rx="26" ry="10" fill="url(#gThrust)"/>

    <g id="body">
      <rect x="54" y="122" width="92" height="82" rx="33" fill="url(#gBody)" stroke="var(--edge)" stroke-width="1.2"/>
      <ellipse cx="78" cy="142" rx="16" ry="9" fill="#fff" opacity="0.10"/>
      <rect x="66" y="142" width="68" height="30" rx="8" fill="var(--screen-bg)" stroke="var(--screen-edge)" stroke-width="1"/>
      <g clip-path="url(#clipScreen)">
        <rect id="scan" x="66" y="142" width="68" height="4" fill="var(--led)" opacity="0.14"/>
      </g>
      <text id="screenText" x="100" y="161.5" text-anchor="middle"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace"
            font-size="10" font-weight="700" letter-spacing="0.6" fill="var(--led)">IDLE</text>
      <!-- Oturum noktaları: her açık Claude Code oturumu için bir nokta,
           meşgul olanlar parlar. Konumları renderer.js yerleştirir. -->
      <g id="dots">
        <circle class="sdot" cx="100" cy="192" r="2.6" fill="var(--led)"/>
        <circle class="sdot" cx="100" cy="192" r="2.6" fill="var(--led)" opacity="0"/>
        <circle class="sdot" cx="100" cy="192" r="2.6" fill="var(--led)" opacity="0"/>
        <circle class="sdot" cx="100" cy="192" r="2.6" fill="var(--led)" opacity="0"/>
        <circle class="sdot" cx="100" cy="192" r="2.6" fill="var(--led)" opacity="0"/>
      </g>
    </g>

    <g id="head">
      <g id="antenna">
        <path id="stalk" d="M100 42 L100 22" stroke="var(--m3)" stroke-width="2.6" stroke-linecap="round"/>
        <circle id="ball" cx="100" cy="20" r="5.5" fill="var(--led)"/>
      </g>
      <rect x="50" y="40" width="100" height="78" rx="39" fill="url(#gHead)" stroke="var(--edge)" stroke-width="1.2"/>
      <g clip-path="url(#clipHead)">
        <ellipse cx="78" cy="58" rx="24" ry="11" fill="#fff" opacity="0.13"/>
      </g>
      <rect x="61" y="57" width="78" height="42" rx="21" fill="url(#gVisor)" stroke="var(--screen-edge)" stroke-width="1"/>
      <g id="eyes">
        <rect id="eyeL" x="78" y="70" width="16" height="16" rx="8" fill="var(--led)"/>
        <rect id="eyeR" x="106" y="70" width="16" height="16" rx="8" fill="var(--led)"/>
      </g>
    </g>
  </g>
</svg>

<script src="renderer.js"></script>
</body>
</html>
